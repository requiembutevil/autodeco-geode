name: Build and Release Auto Deco

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS mod
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Geode mod for iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: given

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: requiem-aura-sixseven-ios
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Auto Deco ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.build-output }}/*.geode
